services:
  jenkins-agent:
    build:
      context: ../..
      dockerfile: service/agent/dockerfile/Dockerfile
    container_name: justifactu-agent
    restart: unless-stopped
    expose:
      - ${AGENT_PORT_INTERNAL}
    environment:
      ONEDRIVE_CONF_DIR: /onedrive/conf
      SECRETS_DIR: /run/secrets
    volumes:
      - onedrive-conf:/onedrive/conf
      - onedrive-data:/onedrive/data
    secrets:
      - ONEDRIVE_TOKEN

volumes:
  onedrive-conf:
  onedrive-data: