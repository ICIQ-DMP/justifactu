services:
  jenkins-agent:
    build:
      context: ../..
      dockerfile: service/agent/dockerfile/Dockerfile
    container_name: justifactu-agent
    restart: unless-stopped
    expose:
      - ${AGENT_PORT_INTERNAL}
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=${JENKINS_AGENT_SSH_PUBKEY}
    volumes:
      - onedrive-conf:/onedrive/conf
      - onedrive-data:/onedrive/data
    secrets:
      - VAULT_ADDR
      - VAULT_CACERT
      - VAULT_ROLE_ID
      - VAULT_SECRET_ID
      - vault.crt
    networks:
      - justicier_justicier_net  # TODO: change into a network not owned by the justicier project


volumes:
  onedrive-conf:
  onedrive-data: